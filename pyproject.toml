[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kev-vllm"
version = "0.1.0"
description = "Experimental text-only Kev pointer model for vLLM 0.30.0"
requires-python = ">=3.12"
dependencies = [
    "vllm==0.30.0; sys_platform != 'win32'",
    "vllm==0.29.0; sys_platform == 'win32'",
    "transformers==5.17.0",
]

[project.entry-points."vllm.general_plugins"]
kev_pointer = "kev_vllm:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["kev_vllm*"]

[project.urls]
Repository = "https://github.com/chahero/kev-vllm"
